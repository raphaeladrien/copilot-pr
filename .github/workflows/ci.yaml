name: Copilot AI PR Review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
     
      - name: Install GitHub CLI
        run: |
            sudo apt update
            sudo apt install gh jq -y
    
      - name: Get PR Diff
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr.diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
      - name: Build Review Input
        run: |
          if [ -f .github/ai/copilot-pr-review.prompt.md ]; then
            cat .github/ai/copilot-pr-review.prompt.md > review_input.txt
          else
            echo "Please review the following PR changes and provide constructive feedback:" > review_input.txt
          fi
          printf "\n\nPR DIFF:\n\n" >> review_input.txt
          cat pr.diff >> review_input.txt

      - name: Call GitHub Models API
        run: |
          PROMPT=$(jq -Rs . < review_input.txt)
          
          curl -X POST https://models.inference.ai.azure.com/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.GH_MODELS_TOKEN }}" \
            -d '{
              "messages": [
                {
                  "role": "system",
                  "content": "You are a helpful code reviewer. Provide constructive feedback on code changes."
                },
                {
                  "role": "user",
                  "content": '"$PROMPT"'
                }
              ],
              "model": "gpt-4o",
              "temperature": 0.7,
              "max_tokens": 2000
            }' > review_output.json

      - name: Debug API Response
        if: always()
        run: |
          echo "=== Full API Response ==="
          cat review_output.json | jq '.' || cat review_output.json
          cat review.md
          
      - name: Extract Review Text
        run: |
          cat review_output.json | jq -r '.choices[0].message.content' > review.md
          echo "=== REVIEW.MD CONTENT ==="
          
          
          if [ ! -s review.md ] || [ "$(cat review.md)" = "null" ]; then
            echo "Failed to extract review. Check API response above." > review.md
            exit 1
          fi
          
      - name: Post Inline PR Comments
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}

          # Get commit SHA
          COMMIT_SHA=$(gh api repos/$REPO/pulls/$PR_NUMBER --jq '.head.sha')

          # Parse review.md issues section and build comments
          COMMENTS="[]"

          # Extract each issue block: file, line, severity, problem, fix
          while IFS= read -r BLOCK; do
            FILE=$(echo "$BLOCK" | grep "^file:" | sed 's/file: *//')
            LINE=$(echo "$BLOCK" | grep "^line:" | sed 's/line: *//')
            SEVERITY=$(echo "$BLOCK" | grep "^severity:" | sed 's/severity: *//')
            PROBLEM=$(echo "$BLOCK" | grep "^problem:" | sed 's/problem: *//')
            FIX=$(echo "$BLOCK" | grep "^minimal_fix:" | sed 's/minimal_fix: *//')

          # Skip if missing required fields
          if [[ -z "$FILE" || -z "$LINE" || -z "$PROBLEM" ]]; then
            continue
          fi

          BODY="**[$SEVERITY]** $PROBLEM"$'\n\n'"**Fix:** $FIX"

          COMMENT=$(jq -n \
            --arg path "$FILE" \
            --argjson line "$LINE" \
            --arg body "$BODY" \
            '{path: $path, line: $line, body: $body}')

          COMMENTS=$(echo "$COMMENTS" | jq ". + [$COMMENT]")

          done < <(awk '/^Issues/,0' review.md | awk 'BEGIN{RS=""; FS="\n"} /^file:/{print $0}' | while IFS= read -r -d '' block; do echo "$block"; done)

          # Post the review
          jq -n \
            --arg sha "$COMMIT_SHA" \
            --argjson comments "$COMMENTS" \
            '{commit_id: $sha, body: "Automated code review", event: "COMMENT", comments: $comments}' \
          | gh api repos/$REPO/pulls/$PR_NUMBER/reviews \
            --method POST \
            --input -

          echo "Posted $(echo $COMMENTS | jq length) inline comments"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

     
