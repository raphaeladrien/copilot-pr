name: Copilot AI PR Review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
     
      - name: Install GitHub CLI
        run: |
            sudo apt update
            sudo apt install gh jq -y
    
      - name: Get PR Diff
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr.diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
      - name: Build Review Input
        run: |
          if [ -f .github/ai/copilot-pr-review.prompt.md ]; then
            cat .github/ai/copilot-pr-review.prompt.md > review_input.txt
          else
            echo "Please review the following PR changes and provide constructive feedback:" > review_input.txt
          fi
          printf "\n\nPR DIFF:\n\n" >> review_input.txt
          cat pr.diff >> review_input.txt

      - name: Call GitHub Models API
        run: |
          PROMPT=$(jq -Rs . < review_input.txt)
          
          curl -X POST https://models.inference.ai.azure.com/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.GH_MODELS_TOKEN }}" \
            -d '{
              "messages": [
                {
                  "role": "system",
                  "content": "You are a helpful code reviewer. Provide constructive feedback on code changes."
                },
                {
                  "role": "user",
                  "content": '"$PROMPT"'
                }
              ],
              "model": "gpt-4o",
              "temperature": 0.7,
              "max_tokens": 2000
            }' > review_output.json

      - name: Debug API Response
        if: always()
        run: |
          echo "=== Full API Response ==="
          cat review_output.json | jq '.' || cat review_output.json

      - name: Extract Review Text
        run: |
          cat review_output.json | jq -r '.choices[0].message.content' > review.md
          
          if [ ! -s review.md ] || [ "$(cat review.md)" = "null" ]; then
            echo "Failed to extract review. Check API response above." > review.md
            exit 1
          fi
          
      - name: Post Inline PR Comments
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}

          COMMIT_SHA=$(gh api repos/$REPO/pulls/$PR_NUMBER --jq '.head.sha')
          FILES=$(gh api repos/$REPO/pulls/$PR_NUMBER/files --jq '.[] | select(.status != "removed") | .filename')

          COMMENTS="[]"

          while IFS= read -r FILE; do
            PATCH=$(gh api repos/$REPO/pulls/$PR_NUMBER/files --jq ".[] | select(.filename == \"$FILE\") | .patch")

            LINE_NUM=0
            CURRENT_LINE=0

            while IFS= read -r LINE; do
              if [[ "$LINE" =~ ^\@\@.*\+([0-9]+) ]]; then
                CURRENT_LINE=$(( ${BASH_REMATCH[1]} - 1 ))
              elif [[ "$LINE" =~ ^\+[^\+] ]]; then
                CURRENT_LINE=$(( CURRENT_LINE + 1 ))
                LINE_NUM=$CURRENT_LINE
                break
              elif [[ ! "$LINE" =~ ^\- ]]; then
                CURRENT_LINE=$(( CURRENT_LINE + 1 ))
              fi
            done <<< "$PATCH"

            if [[ $LINE_NUM -gt 0 ]]; then
              BODY=$(cat review.md | jq -Rs .)
              COMMENT=$(jq -n \
                --arg path "$FILE" \
                --argjson line "$LINE_NUM" \
                --argjson body "$BODY" \
                '{path: $path, line: $line, body: $body}')
              COMMENTS=$(echo "$COMMENTS" | jq ". + [$COMMENT]")
            fi
          done <<< "$FILES"

          jq -n \
            --arg sha "$COMMIT_SHA" \
            --argjson comments "$COMMENTS" \
            '{commit_id: $sha, body: "Automated review", event: "COMMENT", comments: $comments}' \
          | gh api repos/$REPO/pulls/$PR_NUMBER/reviews \
            --method POST \
            --input -

          echo "Done posting $(echo $COMMENTS | jq length) inline comments"

     
